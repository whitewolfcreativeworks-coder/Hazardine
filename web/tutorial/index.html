<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hazardine Tutorial</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body class="tutorial-page">
    <div class="viewer">
      <div class="frame" id="frame">
        <div class="stage" id="stage">
          <header class="stage-top">
            <span class="chapter-title" id="chapter-title"></span>
            <span class="chapter-count" id="chapter-count"></span>
          </header>
          <div class="stage-board board-wrap">
            <div id="board" class="board"></div>
            <div id="fx" class="fx"></div>
            <div id="note" class="note" hidden></div>
          </div>
          <div class="stage-panels">
            <section class="panel" id="p-turn">
              <div class="turn-label" id="turn-label"></div>
              <div class="dice" id="dice"></div>
            </section>
            <section class="panel panel-mid" id="p-mid"></section>
            <section class="panel" id="p-camps"></section>
          </div>
          <div class="caption" id="caption" aria-live="polite">
            <span class="guide" aria-hidden="true">♞</span>
            <p id="caption-text"></p>
          </div>
          <div class="title-card" id="title-card" hidden>
            <span id="title-card-num"></span>
            <strong id="title-card-text"></strong>
          </div>
          <button class="start" id="start" type="button">
            <span class="start-play" aria-hidden="true"></span>
            <span class="start-label">Play the tutorial</span>
            <span class="start-sub">About eight minutes, with narration</span>
          </button>
        </div>
      </div>
      <div class="transport">
        <button id="btn-prev" type="button" aria-label="Previous chapter">Previous</button>
        <button id="btn-play" type="button" class="primary">Pause</button>
        <button id="btn-next" type="button" aria-label="Next chapter">Next</button>
        <label class="voice"><input type="checkbox" id="opt-voice" checked /> Narration</label>
      </div>
      <ol class="chapters" id="chapters"></ol>
      <p class="credit">Narration voice: Piper TTS, LibriTTS-R voice (CC BY 4.0). Every board is a real game state from the Hazardine rules engine.</p>
    </div>
    <script type="module" src="./tutorial.ts"></script>
  </body>
</html>
